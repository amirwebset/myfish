<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="fishGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="finGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#oceanBg)" />

  <!-- Subtle Water Waves / Light Beams -->
  <path d="M0 0 L400 0 L250 600 L0 600 Z" fill="#ffffff" opacity="0.04" />
  <path d="M300 0 L650 0 L500 600 L150 600 Z" fill="#ffffff" opacity="0.03" />
  <circle cx="200" cy="480" r="14" fill="#ffffff" opacity="0.1" />
  <circle cx="240" cy="430" r="8" fill="#ffffff" opacity="0.15" />
  <circle cx="580" cy="520" r="12" fill="#ffffff" opacity="0.1" />
  <circle cx="610" cy="470" r="6" fill="#ffffff" opacity="0.15" />

  <!-- Main Ornamental Fish Graphic (Betta/Cupang Style) -->
  <g filter="url(#shadow)" transform="translate(40, -10)">
    <!-- Flowing Dorsal & Tail Fins -->
    <path d="M 320 280 C 220 180, 150 200, 120 260 C 90 320, 130 420, 240 430 C 280 435, 300 370, 320 340 Z" fill="url(#finGlow)" />
    <path d="M 340 250 C 310 140, 420 120, 480 180 C 510 210, 470 260, 430 260 Z" fill="url(#finGlow)" opacity="0.85" />
    <path d="M 360 350 C 340 450, 450 480, 500 410 C 520 380, 470 340, 430 340 Z" fill="url(#finGlow)" opacity="0.8" />

    <!-- Fish Body -->
    <path d="M 280 300 C 340 240, 480 240, 540 300 C 500 350, 360 360, 280 300 Z" fill="url(#fishGlow)" />

    <!-- Head & Eye -->
    <circle cx="510" cy="290" r="8" fill="#0f172a" />
    <circle cx="512" cy="288" r="2.5" fill="#ffffff" />

    <!-- Scales Texture -->
    <path d="M 370 285 C 385 275, 400 295, 385 305" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.4" />
    <path d="M 400 285 C 415 275, 430 295, 415 305" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.4" />
    <path d="M 430 285 C 445 275, 460 295, 445 305" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.4" />
    <path d="M 385 305 C 400 295, 415 315, 400 325" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.4" />
    <path d="M 415 305 C 430 295, 445 315, 430 325" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.4" />
  </g>

  <!-- Typography Badge -->
  <rect x="250" y="500" width="300" height="48" rx="24" fill="#0f172a" fill-opacity="0.75" />
  <text x="400" y="530" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="2" text-anchor="middle">
    IKANKU • DESA PASANGGAR
  </text>
</svg>

