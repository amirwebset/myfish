<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Checkout - FishShop</title>

    <link rel="stylesheet" href="./style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

<header class="navbar">

    <div class="container nav-content">

        <a href="index.html" class="logo">
            🐟 <span>Fish</span>Shop
        </a>


        <nav id="mainNav">

            <a href="index.html">
                Home
            </a>

            <a href="produk.html">
                Produk
            </a>

            <a href="tentang.html">
                Tentang
            </a>

            <a href="keranjang.html">
                🛒 Keranjang
                <span id="cartCount">0</span>
            </a>

        </nav>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <div class="section-label">
            FIS HSHOP
        </div>

        <h1>
            Checkout
        </h1>

        <p>
            Lengkapi data pemesanan kamu.
        </p>

    </div>

</section>


<section class="section checkout-section">

    <div class="container">

        <div class="checkout-layout">


            <!-- FORM -->
            <div class="checkout-form">

                <h2>
                    Data Pembeli
                </h2>


                <form id="checkoutForm">


                    <label>
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Masukkan nama lengkap"
                        required>


                    <label>
                        Nomor WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="08xxxxxxxxxx"
                        required>


                    <label>
                        Alamat Lengkap
                    </label>

                    <textarea
                        id="customerAddress"
                        rows="5"
                        placeholder="Masukkan alamat lengkap"
                        required></textarea>


                    <label>
                        Catatan Pesanan
                    </label>

                    <textarea
                        id="customerNote"
                        rows="3"
                        placeholder="Contoh: kirim pagi hari"></textarea>


                    <button
                        type="submit"
                        class="btn btn-primary full-btn">

                        📱 Pesan via WhatsApp

                    </button>


                </form>

            </div>


            <!-- RINGKASAN -->
            <div class="checkout-summary">

                <h2>
                    Pesanan Kamu
                </h2>


                <div id="checkoutItems"></div>


                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <strong id="checkoutTotal">
                        Rp0
                    </strong>

                </div>

            </div>


        </div>

    </div>

</section>


<footer>

    <div class="copyright">
        © 2026 FishShop
    </div>

</footer>


<script src="./products.js"></script>
<script src="./script.js"></script>
<script src="./checkout.js"></script>

</body>
</html>
